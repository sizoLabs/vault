services:
  vault:
    image: ghcr.io/sizolabs/vault:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-4321}
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "${PORT:-4321}:${PORT:-4321}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://127.0.0.1:${PORT:-4321}/\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 10s