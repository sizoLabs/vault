services:
  vault:
    image: ghcr.io/sizolabs/vault:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "4321:4321"
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:4321/'
      interval: 5s
      timeout: 20s
      retries: 10